    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Gracefully handle Vite HMR WebSocket disconnection errors in Cloud Run / proxy preview environment
      window.addEventListener(
        'error',
        function (event) {
          if (
            event?.message?.includes('WebSocket') ||
            (typeof event?.filename === 'string' && event.filename.includes('@vite/client')) ||
            (event?.error && typeof event.error.message === 'string' && event.error.message.includes('WebSocket'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event?.reason?.message?.includes('WebSocket') ||
          (typeof event?.reason === 'string' && event.reason.includes('WebSocket'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
