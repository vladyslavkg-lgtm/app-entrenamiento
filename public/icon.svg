<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" stroke="url(#primaryGrad)" stroke-width="4" fill="none" opacity="0.3" stroke-dasharray="16 12" />
  <g transform="translate(256 256) rotate(-35) translate(-256 -256)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="186" y="240" width="140" height="32" rx="8" fill="#e2e8f0" />
    <rect x="226" y="244" width="60" height="24" rx="4" fill="#64748b" />
    <!-- Left Plate Inner -->
    <rect x="156" y="196" width="30" height="120" rx="8" fill="url(#primaryGrad)" />
    <!-- Left Plate Outer -->
    <rect x="126" y="216" width="30" height="80" rx="8" fill="#10b981" />
    <!-- Right Plate Inner -->
    <rect x="326" y="196" width="30" height="120" rx="8" fill="url(#primaryGrad)" />
    <!-- Right Plate Outer -->
    <rect x="356" y="216" width="30" height="80" rx="8" fill="#06b6d4" />
  </g>
  <!-- Sound/Pulse Wave (Gemini Voice Coach Aura) -->
  <path d="M 176 390 Q 216 360 256 390 T 336 390" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="385" r="5" fill="#38bdf8" />
</svg>
